[project]
name = "myapp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MatyCerioli", email = "matiascerioli@gmail.com" }
]
requires-python = ">=3.8"
dependencies = [
    "alembic>=1.14.1",
    "flask>=3.0.3",
    "flask-sqlalchemy>=3.1.1",
]

[project.scripts]
myapp = "myapp:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.17.6",
]
[tool.pytest.ini_options]
pythonpath = ["src"]
